name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron-app
    env:
      # Solo se necesita el build de Vite y los tests; no se descarga el binario de Electron
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # El repo no versiona package-lock.json (ver .gitignore), por eso npm install
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build del renderer (Vite)
        run: npm run build:renderer

      - name: Tests unitarios
        run: npm test
